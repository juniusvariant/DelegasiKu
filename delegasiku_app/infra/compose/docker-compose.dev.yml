# Local development: infrastructure only (postgres + valkey)
# Run services locally with `pnpm dev` while DB/queue run in containers
#
# Usage:
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
#   pnpm --filter @dku/api db:migrate && pnpm db:seed
#   pnpm dev

name: delegasiku-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: delegasiku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delegasiku-dev}
      POSTGRES_DB: delegasiku
    volumes:
      - postgres_dev_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delegasiku -d delegasiku"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev_data:
  valkey_dev_data:
